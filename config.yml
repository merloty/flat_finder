schedule_timezone: Europe/Prague
max_results_per_message: 10
searches:
  - id: prague_commute
    title: "Новые квартиры с доступом до Праги"
    max_price_czk: 4500000
    max_drive_minutes: 40
    # Несколько въездных точек: достаточно уложиться в 40 минут до одной из них.
    destinations:
      - {name: "Černý Most", lat: 50.1082, lon: 14.5775}
      - {name: "Letňany", lat: 50.1250, lon: 14.5169}
      - {name: "Zličín", lat: 50.0531, lon: 14.2907}
      - {name: "Opatov", lat: 50.0279, lon: 14.5086}
    sreality_url: "https://www.sreality.cz/hledani/prodej/byty/stredocesky-kraj?cena-do=4500000&vlastnictvi=osobni"
    source_urls:
      realitymix: "https://realitymix.cz/reality/byty/prodej/stredocesky"
      bezrealitky: "https://www.bezrealitky.cz/vypis/nabidka-prodej/byt/stredocesky-kraj"
      reality_idnes: "https://reality.idnes.cz/s/prodej/byty/stredocesky-kraj/"
      remax: "https://www.remax-czech.cz/reality/vyhledavani/?regions=St%C5%99edo%C4%8Desk%C3%BD+kraj&offer=prodej&type=byt"
      maxi_reality: "https://www.maxirealitypraha.cz/prodej/byty/"
      bazos: "https://reality.bazos.cz/prodam/byt/?hlokalita=11000&humkreis=60&cenado=4500000"
  - id: zabreh
    title: "Новые квартиры: Zábřeh и 5 км вокруг"
    max_price_czk: 4000000
    center: {lat: 49.8826, lon: 16.8722}
    max_radius_km: 5
    # Sreality группирует Zábřeh в выдаче okres Šumperk; радиус ниже
    # отбрасывает Šumperk, Mohelnice и остальные удалённые населённые пункты.
    sreality_url: "https://www.sreality.cz/hledani/prodej/byty/sumperk?cena-do=4000000&vlastnictvi=osobni"
    source_urls:
      realitymix: "https://realitymix.cz/reality/byty/prodej/olomoucky/sumperk"
      bezrealitky: "https://www.bezrealitky.cz/vypis/nabidka-prodej/byt/olomoucky-kraj"
      reality_idnes: "https://reality.idnes.cz/s/prodej/byty/olomoucky-kraj/"
      remax: "https://www.remax-czech.cz/reality/vyhledavani/?query=Z%C3%A1b%C5%99eh&offer=prodej&type=byt"
      maxi_reality: "https://www.maxirealitypraha.cz/prodej/byty/"
      bazos: "https://reality.bazos.cz/prodam/byt/?hlokalita=78901&humkreis=5&cenado=4000000"

sources:
  realitymix: {name: "RealityMix", link_fragment: "/detail/", page_param: "page"}
  bezrealitky: {name: "Bezrealitky", link_fragment: "/nemovitosti-byty-domy/", page_param: "page"}
  reality_idnes: {name: "Reality.iDNES", link_fragment: "/detail/", page_param: "page"}
  remax: {name: "RE/MAX Czech", link_fragment: "/reality/detail/", page_param: "page"}
  maxi_reality: {name: "Maxi Reality Praha", link_fragment: "/prodej/byty/byty-", page_param: "strana"}
  bazos: {name: "Bazoš", link_fragment: "/inzerat/", page_param: "strana", page_mode: "offset_path"}

filters:
  require_personal_ownership: true
  required_terms: ["osobní vlastnictví", "osobnim vlastnictvi"]
  excluded_terms:
    - "družstevní vlastnictví"
    - "druzstevni vlastnictvi"
    - "ateliér"
    - "atelier"
    - "nebytový prostor"
    - "nebytova jednotka"
    - "podíl"
    - "podil"
